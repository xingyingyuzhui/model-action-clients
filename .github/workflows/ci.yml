name: Package validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:check
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: model-action-npm-packages
          path: dist/

  store-durability:
    name: store-durability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test test/store-durability.test.mjs test/client-native.test.mjs
